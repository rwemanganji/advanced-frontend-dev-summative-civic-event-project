<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | CivicEvents</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/custom.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/registrations.js"></script>
  <script src="../js/events.js"></script>
  <script>
    // Login guard: any signed-in user can open this page (admin or normal user).
    requireLogin();
  </script>
</head>
<body class="min-h-screen bg-white font-sans text-ink antialiased" data-page="events">
<main class="mx-auto max-w-7xl px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div><h1 class="text-3xl font-bold">Events</h1><p class="mt-1 text-slate-700">Find and register for events happening around the city.</p></div>
      <!-- Admin only: hidden by default, shown to admins by applyRoleVisibility() in guards.js -->
      <a data-admin-only class="btn btn-primary hidden" href="event-form.html"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M12 4v16m8-8H4"/></svg>New event</a>
    </div>
    <form id="filters" role="search" aria-label="Filter events" class="mt-6 grid gap-4 rounded-xl bg-mist p-4 sm:grid-cols-2 lg:grid-cols-4">
      <div><label for="f-search" class="label">Search by title</label><input id="f-search" type="search" class="input" placeholder="For example: market"></div>
      <div><label for="f-date" class="label">Starting on or after</label><input id="f-date" type="date" class="input"></div>
      <div><label for="f-location" class="label">Location</label><select id="f-location" class="input"><option value="">All locations</option></select></div>
      <div class="flex items-end"><button type="button" id="f-clear" class="btn btn-secondary w-full">Clear filters</button></div>
    </form>
    <p id="results-count" class="mt-4 font-semibold" aria-live="polite" tabindex="-1"></p>
    <div id="event-grid" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    <div id="pager" class="mt-8"></div>
  </main>
  <script>onPage(EventsPage.initList);</script>
</body>
</html>
