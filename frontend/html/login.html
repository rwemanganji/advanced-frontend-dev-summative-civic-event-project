<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CivicEvents</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/custom.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/auth-forms.js"></script>
  <script src="../js/password-toggle.js"></script>
  <script>
    // Guest guard: signed-in users go straight to the dashboard.
    requireGuest();
  </script>
</head>
<body class="min-h-screen bg-[#F4F8F6] font-sans text-ink antialiased" data-page="login">
<main class="mx-auto max-w-md px-4 py-12">
    <img src="../assets/logo.png" alt="CivicEvents logo" class="brand-logo mb-5 h-14 w-14 shadow-sm" width="56" height="56">
    <h1 class="text-3xl font-bold">Log in</h1>
    <p class="mt-1 text-slate-700">Welcome back. Log in to see city events and services.</p>
    <form id="login-form" class="card mt-6 space-y-5 p-6" novalidate>
      <div data-form-error class="hidden rounded-xl border border-danger p-4 text-danger" role="alert"></div>
      <div><label for="email" class="label">Email</label><input id="email" name="email" type="email" autocomplete="email" class="input"></div>
      <div><label for="password" class="label">Password</label>
        <div class="relative" data-field>
          <input id="password" name="password" type="password" autocomplete="current-password" class="input pr-12">
          <button type="button" data-password-toggle="password" class="absolute right-1 top-1/2 -translate-y-1/2 rounded-lg p-2 text-harbor hover:bg-mist" aria-controls="password" aria-pressed="false" aria-label="Show password"><svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.5 12C3.8 7.9 7.6 5 12 5s8.2 2.9 9.5 7c-1.3 4.1-5.1 7-9.5 7s-8.2-2.9-9.5-7z"/></svg></button>
        </div>
      </div>
      <div class="flex items-start gap-3">
        <input id="remember" type="checkbox" class="mt-1 h-5 w-5 accent-[#105243]" aria-describedby="remember-hint">
        <div><label for="remember" class="font-semibold">Remember me</label>
        <p id="remember-hint" class="hint">Keeps you logged in after closing the browser. Do not use on shared computers.</p></div>
      </div>
      <button type="submit" class="btn btn-primary w-full">Log in</button>
      <p class="text-center text-sm">New here? <a class="link" href="signup.html">Create an account</a></p>
    </form>
  </main>
  <script>onPage(AuthForms.initLogin);</script>
</body>
</html>
